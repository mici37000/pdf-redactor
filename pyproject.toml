[project]
name = "pdf-redactor"
version = "0.1.0"
description = "Drag-and-drop redaction of PII in PDF reports"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "PyQt6>=6.6",
]

[project.scripts]
pdf-redactor = "redactor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redactor*"]
